version: 2
updates:
  # Keep the pinned action majors current, so CI does not quietly rot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # The project has no runtime dependencies; this tracks JUnit and the build plugins.
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
